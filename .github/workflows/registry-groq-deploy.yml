name: Groq Deploy (Working → Main)

on:
  workflow_dispatch:
    inputs:
      step:
        description: 'Which step to run'
        required: true
        type: choice
        options:
          - 'refresh-working (Step 8)'
          - 'deploy-main (Step 9)'
          - 'both'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: justask-registry/requirements.txt

    - name: Install dependencies
      working-directory: justask-registry
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Refresh working_version (Step 8)
      if: ${{ inputs.step == 'refresh-working (Step 8)' || inputs.step == 'both' }}
      working-directory: justask-registry
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        PIPELINE_SUPABASE_URL: ${{ secrets.PIPELINE_SUPABASE_URL }}
      run: |
        python -m src.main groq --steps 8

    - name: Deploy to ai_models_main (Step 9) + Refresh AA Mapping
      if: ${{ inputs.step == 'deploy-main (Step 9)' || inputs.step == 'both' }}
      working-directory: justask-registry
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        PIPELINE_SUPABASE_URL: ${{ secrets.PIPELINE_SUPABASE_URL }}
      run: |
        # Deploy to ai_models_main
        python -m src.main groq --steps 9

        # Refresh ims.10_model_aa_mapping for Groq
        echo "Refreshing ims.10_model_aa_mapping for Groq..."
        python -c "
        import os
        import psycopg2
        from src.utils.model_aa_mapping import refresh_model_aa_mapping

        conn = psycopg2.connect(os.environ['PIPELINE_SUPABASE_URL'])
        refresh_model_aa_mapping(conn, inference_provider='Groq')
        conn.close()
        "
