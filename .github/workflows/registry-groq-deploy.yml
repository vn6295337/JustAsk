name: Groq Deploy (Working → Main)

on:
  workflow_dispatch:
    inputs:
      allow_large_drop:
        description: 'Publish even if the model count drops more than 20% (use only for an intended drop)'
        required: false
        type: boolean
        default: false

concurrency:
  group: registry-groq-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: justask-registry/requirements.txt

    - name: Install dependencies
      working-directory: justask-registry
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Deploy to 11_free-models-live (Step 9) + Refresh AA Mapping
      working-directory: justask-registry
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        PIPELINE_SUPABASE_URL: ${{ secrets.PIPELINE_SUPABASE_URL }}
        PUBLISH_ALLOW_LARGE_DROP: ${{ inputs.allow_large_drop }}
      run: |
        # Deploy to 11_free-models-live
        python -m src.main groq --steps 9

        # Refresh justask.21_router-model-benchmark-map for Groq
        echo "Refreshing justask.21_router-model-benchmark-map for Groq..."
        python - <<'PY'
        import sys
        from src.utils.db import get_pipeline_db_connection
        from src.utils.model_aa_mapping import refresh_model_aa_mapping

        # Shared connection helper (IPv4 hostaddr workaround for GitHub runners)
        conn = get_pipeline_db_connection()
        if conn is None:
            print("ERROR: could not connect to database")
            sys.exit(1)
        try:
            ok = refresh_model_aa_mapping(conn, inference_provider='Groq')
        finally:
            conn.close()
        if not ok:
            print("ERROR: refresh_model_aa_mapping failed")
            sys.exit(1)
        PY
