name: Google Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # Daily at 00:00 UTC

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: justask-registry/requirements.txt

    - name: Install dependencies
      working-directory: justask-registry
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Clear old outputs
      run: |
        rm -f justask-registry/outputs/google/*.json justask-registry/outputs/google/*.txt || true

    - name: Run Google pipeline
      working-directory: justask-registry
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PIPELINE_SUPABASE_URL: ${{ secrets.PIPELINE_SUPABASE_URL }}
      run: |
        python -m src.main google

    - name: Commit outputs to repo
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add justask-registry/outputs/google/
        git diff --staged --quiet || git commit -m "Update Google pipeline outputs [skip ci]"
        git push

    - name: Upload outputs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: google-pipeline-outputs
        path: justask-registry/outputs/google/
        retention-days: 7
