name: Google Deploy (Working → Main)

on:
  workflow_dispatch:
    inputs:
      step:
        description: 'Which step to run'
        required: true
        type: choice
        options:
          - 'refresh-working (Step 7)'
          - 'deploy-main (Step 8)'
          - 'both'

concurrency:
  group: registry-google-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: justask-registry/requirements.txt

    - name: Install dependencies
      working-directory: justask-registry
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Refresh working_version (Step 7)
      if: ${{ inputs.step == 'refresh-working (Step 7)' || inputs.step == 'both' }}
      working-directory: justask-registry
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PIPELINE_SUPABASE_URL: ${{ secrets.PIPELINE_SUPABASE_URL }}
      run: |
        python -m src.main google --steps 7

    - name: Deploy to ai_models_main (Step 8) + Refresh AA Mapping
      if: ${{ inputs.step == 'deploy-main (Step 8)' || inputs.step == 'both' }}
      working-directory: justask-registry
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PIPELINE_SUPABASE_URL: ${{ secrets.PIPELINE_SUPABASE_URL }}
      run: |
        # Deploy to ai_models_main
        python -m src.main google --steps 8

        # Refresh ims.10_model_aa_mapping for Google
        echo "Refreshing ims.10_model_aa_mapping for Google..."
        python - <<'PY'
        import sys
        from src.utils.db import get_pipeline_db_connection
        from src.utils.model_aa_mapping import refresh_model_aa_mapping

        # Shared connection helper (IPv4 hostaddr workaround for GitHub runners)
        conn = get_pipeline_db_connection()
        if conn is None:
            print("ERROR: could not connect to database")
            sys.exit(1)
        try:
            ok = refresh_model_aa_mapping(conn, inference_provider='Google')
        finally:
            conn.close()
        if not ok:
            print("ERROR: refresh_model_aa_mapping failed")
            sys.exit(1)
        PY
