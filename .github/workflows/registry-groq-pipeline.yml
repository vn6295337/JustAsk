name: Groq Pipeline

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Google Pipeline"]
    types:
      - completed

concurrency:
  group: registry-groq-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # Only run if manually triggered or if Google pipeline succeeded
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: justask-registry/requirements.txt

    - name: Install dependencies
      working-directory: justask-registry
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Clear old outputs
      run: |
        rm -f justask-registry/outputs/groq/*.json justask-registry/outputs/groq/*.txt || true

    - name: Run Groq pipeline
      working-directory: justask-registry
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        PIPELINE_SUPABASE_URL: ${{ secrets.PIPELINE_SUPABASE_URL }}
      run: |
        python -m src.main groq

    - name: Commit outputs to repo
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add justask-registry/outputs/groq/
        if git diff --staged --quiet; then
          echo "No output changes to commit"
          exit 0
        fi
        git commit -m "Update Groq pipeline outputs [skip ci]"
        for i in 1 2 3; do
          if git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push; then
            exit 0
          fi
          sleep $((i * 5))
        done
        echo "ERROR: could not push outputs after 3 attempts"
        exit 1

    - name: Upload outputs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: groq-pipeline-outputs
        path: justask-registry/outputs/groq/
        retention-days: 7
